server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      forwarded:
        enabled: false
      x-forwarded:
        enabled: false
      discovery:
        locator:
          enabled: false
      routes:
        - id: ms-usuarios
          uri: http://ms-usuarios:8081
          predicates:
            - Path=/api/usuarios/**
        - id: ms-productos
          uri: http://ms-productos:8082
          predicates:
            - Path=/api/productos/**,/api/categorias/**
        - id: ms-ventas
          uri: http://ms-ventas:8083
          predicates:
            - Path=/api/ventas/**,/api/pedidos/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
